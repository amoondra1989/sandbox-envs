# Toolchains baked into the sandbox image. Edit versions here, then rebuild:
#   podman build -t sandbox-env:latest .
#
# Defaults (mise global): Go 1.23.6, Temurin 26, Maven 3.9.9, Gradle 8.12.1.
# Additional Go/Java versions are installed for per-command use via mise exec.

[tools]
go = ["1.22.12", "1.23.6"]
java = ["temurin-11.0.26", "temurin-17.0.14", "temurin-21.0.6", "temurin-24.0.0", "temurin-26.0.0"]
maven = "3.9.9"
gradle = "8.12.1"
